<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Brisbane Go, a 3D wildlife collecting game." />
    <title>Brisbane Go — 3D wildlife explorer</title>
    <script type="module" crossorigin src="/assets/index-CWzQDsey.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-C9QKZ-fX.css">
  </head>
  <body>
    <div id="app">
      <div class="brand"><span>🧭</span><div><strong>Brisbane Go</strong><small>3D wildlife explorer</small></div></div>
      <div class="objective" id="objective">Find a local creature in the park.</div>
      <button class="city-view-button" id="cityViewButton" type="button">View Brisbane <kbd>C</kbd></button>
      <button class="brissydex-button" id="brissydexButton" type="button">Brissydex <kbd>B</kbd></button>
      <div class="crosshair" aria-hidden="true"></div>
      <aside class="hud brissydex" id="brissydex" aria-label="Brissydex wildlife knowledge" hidden>
        <div class="guide-title"><span>Brissydex</span><strong id="guideCount">0 / 15</strong><button class="brissydex-close" id="brissydexClose" type="button" aria-label="Close Brissydex">×</button></div>
        <div class="dex-detail" id="dexDetail">Catch a creature to unlock its Brisbane wildlife knowledge.</div>
        <div class="guide-list" id="guideList"></div>
      </aside>
      <div class="controls" id="controls">
        <strong>Explore Brisbane's river city</strong>
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &nbsp; mouse / arrows look &nbsp; <kbd>Click</kbd> or <kbd>Space</kbd> throw orb</span>
      </div>
      <div class="orb-bag" aria-label="Catch Orbs available"><span class="mini-orb" aria-hidden="true"></span><strong id="orbCount">20</strong><small>Catch Orbs</small></div>
      <div class="catch-prompt is-hidden" id="catchPrompt"><span id="catchPromptText">A creature is nearby</span><button id="catchButton" type="button">Throw orb <kbd>Space</kbd></button></div>
      <div class="message" id="message" role="status" aria-live="polite"></div>
      <button class="start-button" id="startButton" type="button">Enter the park <span>Click to capture the mouse</span></button>
    </div>
  </body>
</html>
